<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="きょうのひとつ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f6b4f">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>きょうのひとつ</title>
<style>
/* VOICE everyday: calm practice notebook for one adult, 12 weeks
   IDEA a 12-week practice card (like a radio-exercise stamp card) that fills one cell per day
   PICTURE today's single action, large; on review, the 12x7 stamp grid and before/after check
   COLOUR pure white, deep leaf green leads, pale green fields, coral marks "today"
   TYPE iPhone system Japanese (Hiragino Sans), large sizes for presbyopia
   LAYOUT one column max 560px; sticky header, fixed bottom tabs; phone first */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1813);--ink:light-dark(#14211a,#eef5f0);--muted:light-dark(#4e5f56,#a8b9af);--green:light-dark(#1f6b4f,#5cc596);--green-ink:light-dark(#ffffff,#08140e);--soft:light-dark(#e5f2ea,#173324);--card:light-dark(#f3f8f5,#14231b);--line:light-dark(#cfded5,#2a4034);--coral:light-dark(#d9482e,#ff8a6e);--miss:light-dark(#9aa8a0,#6f8077)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
html{font-size:18px;height:100%}
html.xl{font-size:21px}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 -apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-weight:700;font-size:1rem;flex:1}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.78rem;line-height:1.3}
.gear{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;padding:0 14px;font-size:.85rem}
main{padding-block:18px calc(110px + env(safe-area-inset-bottom,0px))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding-block:6px}
nav.tabs button{border:0;background:none;border-radius:14px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.8rem;color:var(--muted)}
nav.tabs button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=page]{color:var(--green);background:var(--soft);font-weight:700}
h2{font-size:1.35rem;line-height:1.3;margin:0 0 12px}
h3{font-size:1.05rem;margin:28px 0 10px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.goal{border-left:4px solid var(--green);padding:4px 0 4px 14px;margin:0 0 18px}
.goal span{display:block;font-size:.8rem;color:var(--muted)}
.goal b{font-size:1.05rem;font-weight:600}
.action{background:var(--green);color:var(--green-ink);border-radius:22px;padding:22px 20px 20px;margin-bottom:14px}
.action .lab{font-size:.85rem;opacity:.85;margin-bottom:6px}
.action .txt{font-size:1.6rem;line-height:1.4;font-weight:700;letter-spacing:.01em}
.action .force{margin-top:14px;font-size:.8rem;opacity:.85}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:16px;border:2px solid var(--green);background:var(--bg);color:var(--green);font-weight:700;font-size:1rem;padding:8px 14px;text-align:center}
.btn.solid{background:var(--green);color:var(--green-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn+.btn{margin-top:10px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row2 .btn+.btn{margin-top:0}
.status{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px}
.mini{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;margin:6px 0 4px}
.mini i{display:block;aspect-ratio:1;border-radius:3px;background:var(--line)}
.mini i.d{background:var(--green)}
.mini i.t{outline:2px solid var(--coral);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px;margin-bottom:16px;background:var(--card)}
.seg button{border:0;background:none;border-radius:11px;min-height:44px;padding:0 18px;font-size:.9rem}
.seg button[aria-pressed=true]{background:var(--bg);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.big2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.big2 button{min-height:120px;border-radius:20px;border:2px solid var(--line);background:var(--card);font-size:1.15rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.big2 button svg{width:40px;height:40px;fill:none;stroke-width:3;stroke:currentColor;stroke-linecap:round}
.big2 button.yes[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.big2 button.no[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
label.f{display:block;font-weight:600;margin:6px 0 6px}
textarea,input[type=text]{width:100%;font-size:1rem;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg);line-height:1.5}
textarea{min-height:96px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--green);outline-offset:1px}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.wk button{min-width:48px;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:1.2rem}
.wk b{text-align:center;font-size:1rem;line-height:1.35}
.week7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:14px}
.week7 div{text-align:center;font-size:.8rem;color:var(--muted)}
.week7 i{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:50%;margin-top:4px;border:2px solid var(--line);font-style:normal;font-weight:700;font-size:1rem}
.week7 i.d{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.week7 i.m{border-color:var(--miss);color:var(--miss)}
.week7 i.t{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--coral)}
.fb{background:var(--soft);border-radius:18px;padding:16px 18px;margin-bottom:14px}
.fb p:last-child{margin:0}
.memo{border-top:1px solid var(--line);padding:10px 0}
.memo:last-child{border-bottom:1px solid var(--line)}
.memo .d{font-size:.8rem;color:var(--muted)}
.grid12{display:grid;grid-template-columns:3em repeat(7,minmax(0,1fr)) 3em;gap:4px;align-items:center;font-size:.8rem}
.grid12 i{display:block;aspect-ratio:1;border-radius:4px;background:var(--card);border:1px solid var(--line)}
.grid12 i.d{background:var(--green);border-color:var(--green)}
.grid12 i.m{background:transparent;border:2px solid var(--miss)}
.grid12 i.f{background:transparent;border:1px dashed var(--line)}
.grid12 i.t{outline:2px solid var(--coral);outline-offset:1px}
.grid12 .n{text-align:right;color:var(--muted);white-space:nowrap}
.grid12 .c{font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
.q{padding:12px 0;border-top:1px solid var(--line)}
.q .t{font-size:.95rem;margin-bottom:8px}
.track{position:relative;height:28px;margin:0 10px}
.track::before{content:"";position:absolute;left:0;right:0;top:13px;height:2px;background:var(--line)}
.track .bar{position:absolute;top:11px;height:6px;border-radius:3px;background:var(--green);opacity:.35}
.track .dot{position:absolute;top:5px;width:18px;height:18px;margin-left:-9px;border-radius:50%}
.track .s{background:var(--bg);border:3px solid var(--miss)}
.track .e{background:var(--green);border:2px solid var(--bg)}
.scale{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin:0 4px}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5em,1fr));gap:10px;margin:8px 0 14px}
.tot div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.tot b{display:block;font-size:1.6rem;line-height:1.2;font-variant-numeric:tabular-nums}
.tot span{font-size:.8rem;color:var(--muted)}
.likert{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.likert button{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:1.1rem;font-weight:700}
.likert button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.ends{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-top:4px}
.forces{display:grid;gap:10px;margin:12px 0}
.forces button{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px 16px;min-height:64px}
.forces button b{display:block;font-size:1.15rem}
.forces button span{font-size:.85rem;color:var(--muted)}
.forces button[aria-pressed=true]{border-color:var(--green);background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:.85rem;min-height:44px;text-align:left}
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.overlay .top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;border-bottom:1px solid var(--line);margin-bottom:16px}
.steps{font-size:.8rem;color:var(--muted)}
.note{border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:.9rem;margin:14px 0;background:var(--card)}
.note b{display:block;margin-bottom:4px}
.banner{background:var(--coral);color:#fff;border-radius:14px;padding:10px 14px;font-size:.85rem;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner button{border:1px solid #fff;background:none;color:#fff;border-radius:10px;min-height:40px;padding:0 12px;font-size:.85rem}
.set h3{border-top:1px solid var(--line);padding-top:18px}
.set ol,.set ul{padding-left:1.3em;margin:0 0 12px}
.set li{margin-bottom:6px}
.src{font-size:.85rem}
.src li{margin-bottom:10px}
.confirm{background:var(--card);border:2px solid var(--coral);border-radius:16px;padding:14px 16px;margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-size:.9rem;z-index:30;max-width:90vw}
.saved{font-size:.8rem;color:var(--green);min-height:1.4em;margin-top:4px}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
@media (prefers-reduced-motion:no-preference){.action{animation:rise .35s ease-out}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand" id="brand">きょうのひとつ<small id="sub">12週間の練習</small></div><button class="gear" id="gear" type="button">設定</button></div></header>
<main><div class="wrap" id="view"></div></main>
<nav class="tabs" aria-label="画面"><div class="wrap">
<button type="button" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>今日の行動</button>
<button type="button" data-tab="night"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>夜の記録</button>
<button type="button" data-tab="review"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>振り返り</button>
</div></nav>
<div id="ov"></div>
<script>
{
const KEY='kyou-no-hitotsu.v1', DAYS=84;
const FORCES={
kinben:{name:'勤勉性',lead:'決めたことを、計画を立ててコツコツやる力',ex:['やると決めたことを、小さく毎日進める自分','後回しにせず、先に手をつける自分','計画を立ててから、落ち着いて動く自分'],acts:['今日やることを3つだけ書き出す','いちばん面倒なことに、午前中に5分だけ手をつける','机の上を1か所だけ片づける','明日の朝の準備を、寝る前に1つしておく','返信を1つ、その場で済ませる','始める時刻を決めて、その時刻に始める','5分タイマーをかけて、1つの作業だけをする','終わったことに「済」の印をつける','先のばしにしていることの、最初の一歩だけやる','約束の5分前に準備を終える','使った物を、その場で元に戻す（1回でOK）','今週の予定を3分だけ見直す','頼まれごとを1つ、期限より早く出す','書類か写真を1つだけ整理する','今日の終わりに、明日の最初の1つを決める']},
jiko:{name:'自己管理',lead:'気持ちや誘惑に流されず、行動を選ぶ力',ex:['イラッとしても、ひと呼吸おいて返せる自分','やめると決めたことを、やめられる自分','自分の時間と体力を、上手に配分できる自分'],acts:['スマホを見る前に、深呼吸を3回する','イラッとしたら、返事の前に6秒待つ','寝る30分前にスマホを置く','何か食べたくなったら、まず水を1杯飲む','「今日はやめておく」ことを1つ決めて守る','疲れたら、3分だけ目を閉じて休む','買う前に「本当に必要？」と一度考える','予定にない動画やSNSは、10分タイマーで止める','決めた時刻に、寝る準備を始める','今の気持ちを、ひと言で書いてみる','迷ったら「少し考えます」と言って時間をとる','朝いちばんに、今日の調子を10点満点でつける','あとでやることは、メモに書いて頭から出す']},
yarinuku:{name:'やり抜く力',lead:'うまくいかなくても、あきらめずに続ける力',ex:['うまくいかなくても、やり方を変えて続ける自分','長い目標を、一歩ずつ進められる自分','途中でやめたくなっても、もう少し続けられる自分'],acts:['目標に向けた作業を、10分だけする','うまくいかなかったことを1つ、やり方を変えてもう一度','「なぜこれをやりたいか」を1行で書く','昨日の続きを、1つだけ進める','苦手なことを、5分だけ練習する','今日できたことを、小さくても1つ書き残す','やめたくなったら、あと1分だけ続ける','目標を「次の一歩」に小さく分けて書く','うまくいかなかったことから、わかったことを1つ書く','学んだことを、誰かに1つ話す','毎日続けていることを、今日も1回やる','尊敬する人ならどうするかを考えて、1つ動く','1年後の自分に、ひと言メッセージを書く']},
seijitsu:{name:'誠実さ',lead:'約束を守り、正直にふるまう力',ex:['小さな約束も、言ったとおりに守る自分','まちがえたら、すぐ正直に言える自分','人の話を最後まで聞ける自分'],acts:['小さな約束を1つ、言ったとおりに守る','「ありがとう」を、理由をつけて1回伝える','まちがえたら、すぐに「ごめんなさい」と言う','約束の時刻を、1つ守る','人の話を、最後までさえぎらずに聞く','できないことは、早めに正直に伝える','借りた物か、頼まれた物を1つ届ける','自分で決めたルールを1つ守る','誰も見ていないところで、よいことを1つする','頼まれたことは、メモしてから引き受ける','その場にいない人の悪口を言わない日にする','夜に「言ったこととしたことが同じだったか」を振り返る']}
};
const QS=[['やると決めたことは、最後までやり終えるほうだ','kinben'],['予定や計画を立ててから動くほうだ','kinben'],['気持ちが乱れても、落ち着いて行動を選べる','jiko'],['目の前の誘惑より、先の目標を優先できる','jiko'],['うまくいかなくても、あきらめずに続けられる','yarinuku'],['時間がかかる目標にも、興味を持ち続けられる','yarinuku'],['人との約束や、自分との約束を守っている','seijitsu'],['ミスや苦手なことも、正直に認められる','seijitsu']];
const WD='日月火水木金土';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const today=()=>ymd(new Date());
const md=s=>{const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()};
const jp=s=>{const d=pd(s);return (d.getMonth()+1)+'月'+d.getDate()+'日（'+WD[d.getDay()]+'）'};
let S=load(), tab=new Date().getHours()>=15?'night':'today', nightDate=null, reviewWeek=null, setup=null, sheet=false, confirmKind=null;
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.cycles))return o}}catch(e){}return{v:1,cycles:[],cur:-1,big:false,lastBackup:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('保存できませんでした。バックアップをおすすめします')}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const C=()=>S.cycles[S.cur];
const dayNo=c=>diff(c.start,today())+1;
const weekOf=(c,d)=>Math.floor(diff(c.start,d)/7)+1;
const wdates=(c,w)=>Array.from({length:7},(_,i)=>add(c.start,(w-1)*7+i));
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
function pick(c,date,ex){const n=FORCES[c.force].acts.length,used=new Set();for(let i=1;i<=10;i++){const r=c.days[add(date,-i)];if(r&&r.a!=null)used.add(r.a)}if(ex!=null)used.add(ex);let pool=[...Array(n).keys()].filter(i=>!used.has(i));if(!pool.length)pool=[...Array(n).keys()].filter(i=>i!==ex);return pool[Math.floor(Math.random()*pool.length)]}
function rec(c,date,make){let r=c.days[date];if(!r&&make){r=c.days[date]={}}if(r&&make&&r.a==null){r.a=pick(c,date);save()}return r}
const actText=(c,r)=>r&&r.a!=null?FORCES[c.force].acts[r.a]:null;

function render(){
  document.documentElement.classList.toggle('xl',!!S.big);
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  const c=C();
  if(!c){$('#sub').textContent='12週間の練習';$('#view').innerHTML='';renderSetup();return}
  const n=dayNo(c);
  $('#sub').textContent=n>DAYS?'12週間が終わりました':`第${Math.ceil(n/7)}週・${n}日目／84日`;
  const ban=c.sample?`<div class="banner"><span>見本のデータを表示しています</span><button type="button" id="clearSample">見本を消して始める</button></div>`:'';
  $('#view').innerHTML=ban+(tab==='today'?vToday(c):tab==='night'?vNight(c):vReview(c));
  bind(c);
  renderOverlay();
}

  <p>このアプリは医療や診断のためのものではありません。効果を約束するものでもありません。自分で12週間使って、続けやすさと変化を確かめるための試作です。</p>
  <p><b>もとにした考え方</b></p>
  <ul class="src">
  <li>TBS「news23」2026年10月9日放送（中室牧子さんのインタビュー）：スマホアプリで大人の非認知能力が伸びたという研究が紹介されました。「なりたい自分を決める → 合った行動が毎日提案される → くり返すうちに身につく」という仕組みです。</li>
  <li>Conscientiousness Coach の研究（Journal of Neurology 2025年、DOI: 10.1007/s00415-025-13320-9）：スマホアプリと定期的なコーチングを組み合わせた12週間のランダム化比較試験で、介入群の勤勉性が向上したと報告されています（効果量 d=0.93）。構成要素は「価値の明確化」「SMART目標」「スマホでの記録」「定期的なコーチング」です。</li>
  <li>中室牧子『「学力」の経済学』：非認知能力は大人になっても変わるものが少なくなく、自制心は継続と反復、計画・記録・達成度の管理で鍛えられる、と書かれています。</li>
  <li>PIVOT「非認知能力は中年にこそ重要である」：追跡研究では、非認知能力が収入に与える影響は40〜60歳で最も大きくなると紹介されています。</li></ul>
  <p><b>研究との違い</b></p>
  <p class="small">研究はアプリと人によるコーチングがセットでした。このアプリにはコーチがいないので、週1回の「振り返り」で代わりにしています。研究と同じ効果が出るとは言えません。「なりたい自分」は価値の明確化、毎日の小さな行動は目標づくり、夜の記録はスマホでの記録にあたります。自己チェックの質問はこのアプリのために作ったもので、研究で検証された尺度ではありません。</p>
  <h3>データを消す</h3>
  <button class="btn" type="button" id="del" style="border-color:var(--coral);color:var(--coral)">すべての記録を消す</button><div id="cf2"></div>
  </div>`;
}
function bindSettings(){
  const ov=$('#ov'),on=(q,f)=>{const el=ov.querySelector(q);if(el)el.onclick=f};
  on('#cls2',()=>{sheet=false;render()});
  ov.querySelectorAll('[data-big]').forEach(b=>b.onclick=()=>{S.big=b.dataset.big==='1';save();render()});
  on('#sg',()=>{const g=$('#goal2').value.trim();if(g){C().goal=g;save();toast('保存しました')}});
  on('#ex',exportData);
  on('#cp',async()=>{try{await navigator.clipboard.writeText($('#raw').value);markBackup();toast('コピーしました。メモなどに貼って保存してください')}catch(e){$('#raw').select();toast('テキストを長押しでコピーしてください')}});
  const raw=$('#raw');if(raw)raw.value=JSON.stringify(S);
  const imp=$('#imp');if(imp)imp.onchange=()=>{const f=imp.files[0];if(!f)return;f.text().then(t=>{let o;try{o=JSON.parse(t)}catch(e){}if(!o||!Array.isArray(o.cycles)){toast('このファイルは読みこめませんでした');return}
    $('#cf').innerHTML=`<div class="confirm"><p>今の記録を、このバックアップ（${o.cycles.length}クール分）で置きかえますか？</p><div class="row2"><button class="btn" type="button" id="no1">やめる</button><button class="btn solid" type="button" id="ok1">置きかえる</button></div></div>`;
    on('#no1',()=>{$('#cf').innerHTML=''});on('#ok1',()=>{S=o;save();sheet=false;setup=null;reviewWeek=null;render();toast('もとに戻しました')})})};
  on('#del',()=>{$('#cf2').innerHTML=`<div class="confirm"><p>すべての記録を消します。もとに戻せません。先にバックアップをおすすめします。</p><div class="row2"><button class="btn" type="button" id="no2">やめる</button><button class="btn solid" type="button" id="ok2" style="background:var(--coral);border-color:var(--coral)">消す</button></div></div>`;
    on('#no2',()=>{$('#cf2').innerHTML=''});on('#ok2',()=>{S={v:1,cycles:[],cur:-1,big:S.big,lastBackup:null};save();sheet=false;setup={step:0,pre:[]};reviewWeek=null;render()})});
}
function markBackup(){S.lastBackup=new Date().toISOString().slice(0,10);save()}
async function exportData(){
  const name='kyou-no-hitotsu-backup-'+today()+'.json',file=new File([JSON.stringify(S)],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});markBackup();toast('書き出しました');render();return}}catch(e){if(e&&e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();markBackup();toast('書き出しました');render()}catch(e){toast('書き出せませんでした。テキストで写す方法を使ってください')}
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(tab==='night')nightDate=null;window.scrollTo(0,0);render()});
$('#gear').onclick=()=>{sheet=true;renderOverlay()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!sheet&&!setup)render()});
render();
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
</script>
</body>
